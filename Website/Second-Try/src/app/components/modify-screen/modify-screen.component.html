<div class="all" (mouseup)="onMouseUp()">
    <div class="arrow-div">
        <mat-icon
            class="arrow a-right"
            (click)="goForward()"
            fontIcon="chevron_right"
        ></mat-icon>
        <mat-icon
            class="arrow a-left"
            (click)="goBackward()"
            fontIcon="chevron_left"
        ></mat-icon>
    </div>
    <!-- We can't just change between the elements because the html looses the reference for "style: transform (that the way angular does drag and drop)"-->
    <!-- Because of this we redner everything all the time, and just change z-indexes of the planes-->
    <div class="drag-container">
        <!-- <div class="counter">
            <p>{{ counter }} / 3</p>
        </div> -->
        <div class="boundary">
            <!-- <div
                *ngFor="let index of [0, 1, 2]"
                class="screen"
                [ngStyle]="{
                    'z-index': index === counter ? 1 : 0
                }"
            > -->
                <div
                    *ngFor="let element of chosenElements[counter]; let i = index"
                    class="screen-element text-element"
                    cdkDrag
                    [cdkDragConstrainPosition]="snap(i)"
                    id="{{ i }}"
                    style="left: {{ element.startPosition.left }}px; top: {{
                        element.startPosition.top
                    }}px;"
                >
                    <!-- [ngStyle]="{
                        left: element.startPosition.left + 'px',
                        top: element.startPosition.top + 'px'
                    }" -->
                    <ng-container *ngIf="element.unit != 'None'; else noUnit">
                        <p class="text-title">{{ element.title }}</p>
                        <div class="text-value">
                            <p>0.0</p>
                            <p>
                                {{ element.unit }}
                            </p>
                        </div>
                    </ng-container>
                    <ng-template #noUnit>
                        <p class="text-title">{{ element.title }}</p>
                        <div class="text-value">
                            <p>0.0</p>
                        </div>
                    </ng-template>
                </div>
            <!-- </div> -->
        </div>
        <div class="selectbox">
            <div
                class="title-selectbox"
                *ngIf="selectedTitle === buttonTitleGraph"
            >
                <div class="selectbox-item" (click)="changeSelectedTitle()">
                    <h2>Text</h2>
                </div>
                <div class="selected-title">
                    <h2>Graphics</h2>
                </div>
            </div>
            <div
                class="title-selectbox"
                *ngIf="selectedTitle === buttonTitleText"
            >
                <div class="selected-title">
                    <h2>Text</h2>
                </div>
                <div class="selectbox-item" (click)="changeSelectedTitle()">
                    <h2>Graphics</h2>
                </div>
            </div>
            <div *ngFor="let element of selectedTitle">
                <div
                    class="selectbox-item"
                    (click)="createBox(element)"
                    *ngIf="!chosenElements[this.counter].includes(element)"
                >
                    <h2>{{ element.title }}</h2>
                </div>
            </div>
        </div>
    </div>
</div>
