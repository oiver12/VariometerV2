<mat-card class="card">
    <mat-card-header class="header">
        <img mat-card-image src="{{ image }}" alt="{{ title }}" />
        <h2 class="title">{{ title }}</h2>
    </mat-card-header>
    <mat-card-content>
        <p>
            {{ content }}
        </p>
    </mat-card-content>
</mat-card>
