<div class="fading-out">
    <div class="rotate">
        <div class="outer-dot circle-color"></div>
        <div class="inner-dot right-bkg-color"></div>
        <div class="information-circle outer-information-circle circle-color"></div>
        <div class="information-circle inner-information-circle right-bkg-color"></div>
        <div class="information-text-div right-bkg-color">
            <p>Swissmade</p>
        </div>
    </div>
    <ng-container *ngFor="let poperty of properties">
        <div class="rotate">
            <div class="information-circle outer-information-circle circle-color"></div>
            <div class="information-circle inner-information-circle right-bkg-color"></div>
            <div class="information-text-div right-bkg-color">
                <p>{{ poperty }}</p>
            </div>
        </div>
    </ng-container>
</div>
