<div class="fading-out">
    <div class="rotate">
        <div class="outer-dot"></div>
        <div class="inner-dot"></div>
        <div class="information-circle outer-information-circle"></div>
        <div class="information-circle inner-information-circle"></div>
        <div class="information-text-div">
            <p>Swissmade</p>
        </div>
    </div>
    <ng-container *ngFor="let poperty of properties">
        <div class="rotate">
            <div class="information-circle outer-information-circle"></div>
            <div class="information-circle inner-information-circle"></div>
            <div class="information-text-div">
                <p>{{ poperty }}</p>
            </div>
        </div>
    </ng-container>
</div>
