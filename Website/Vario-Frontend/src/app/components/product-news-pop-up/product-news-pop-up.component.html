<div class="left-side left-bkg-color"></div>
<div class="right-side right-bkg-color"></div>
<div class="whole-div">
    <h1>Bleiben Sie auf dem Laufenden</h1>
    <div mat-dialog-content>
        <p>
            Bleiben Sie mit unseren Produktneuigkeiten auf dem Laufenden!
            Erhalten Sie die neuesten Informationen zu Software-Updates, neuen
            Veröffentlichungen und Sonderaktionen.
        </p>
        <div class="email-div">
            <div appearance="outline" class="email-input-field">
                <input class="email-input" placeholder="Email Addresse" />
            </div>
        </div>
        <p class="center">
            Melden Sie sich jetzt an und bleiben Sie informiert!
        </p>
        <div class="button-div">
            <button (click)="onClick()" mat-raised-button>Abonnieren</button>
        </div>
    </div>
</div>
